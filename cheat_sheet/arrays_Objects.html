<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cheat sheet for arrays and objects</title>
</head>
<body>
    <h1>Array for bok med en forfatter</h1>
    <ul>
        <li>Tittel: <span id="book1TitleSpan"></span></li>
        <li>Forfatter(e): <span id="book1AuthorSpan"></span></li>
        <li>Antall sider: <span id="book1CountSpan"></span></li>
    </ul>

    <h1>Array for bok med flere forfattere</h1>
    <ul>
        <li>Tittel: <span id="book2TitleSpan"></span></li>
        <li>Forfatter(e): <span id="book2AuthorSpan"></span></li>
        <li>Antall sider: <span id="book2PageCountSpan"></span></li>
    </ul>

    <h1>Object for bok</h1>
    <ul>
        <li>Tittel: <span id="book3TitleSpan"></span></li>
        <li>Forfatter(e): <span id="Book3AuthorSpan"></span></li>
        <li>Antall sider: <span id="book3PageCountSpan"></span></li>
    </ul>

    <script>
        //Array med bok med en forfatter

        const book1 = [
            "fourth wing",
            "rebecka Yaris",
            512
        ]

        //Array med bok med flere forfattere

        const book2 = [
            "Silver eyes",
            "Scott Cawthon",
            "Keira Wristley",
            365
        ]

        //object med bok
        const book3 = {
            title: "Harry Potter og de vises sten",
            author: "JK Rowling",
            pagecount: 333
    }

        //Print info fra book1 til Html:
        document.getElementById("book1TitleSpan").innerHTML = book1[0];
        document.getElementById("book1AuthorSpan").innerHTML = book1[1];
        document.getElementById("book1CountSpan").innerHTML = book1[2];

        //print info fra book2 til Html:

        document.getElementById("book2TitleSpan").innerHTML = book2[0];
        document.getElementById("book2AuthorSpan").innerHTML = book2[1] + ", "  + book2[2];
        document.getElementById("book2PageCountSpan").innerHTML = book2[3];

        //print info fra book3 til html
        //book3 er et object, vi må derfor referere til nøkler i stedet for indexer
        document.getElementById("book3TitleSpan").innerHTML = book3["title"];
        document.getElementById("Book3AuthorSpan").innerHTML = book3["author"];
        document.getElementById("book3PageCountSpan").innerHTML = book3["pagecount"];
        //Kan skrive med punktom også feks: book3.title
    </script>
</body>
</html>
