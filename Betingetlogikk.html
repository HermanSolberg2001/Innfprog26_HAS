<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cheat sheet for betinget logikk</title>
</head>
<body>

    <p id="loginStatus">Ikke logget inn</p>

    <script>
        const username = "marius";
        const password = "passord123";
        let loggedIn = false;
       
        //If-test som sjekker om innsendt brukernavn matcher systemet:

        if(username === "marius") {
            console.log("brukernavn er riktig");

        }
        else {
            console.log("feil brukernavn");
        }

        //if-test som sjekker om brukernavn og passord er riktig, og gjør klar login:

        if(username === "marius" && password === "passord123") {
            loggedIn = true;
            console.log(loggedIn);
        }
    </script>
</body>
</html>
